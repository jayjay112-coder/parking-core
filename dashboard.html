<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking Dashboard</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;padding:16px;background:#f4f6f8;color:#1b1f23}
  h1{font-size:20px;margin:0 0 12px}
  h2{font-size:16px;margin:22px 0 8px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .slot{border-radius:8px;padding:12px;color:#fff}
  .slot.empty{background:#2e8b57}
  .slot.occ{background:#c0392b}
  .slot b{font-size:18px;display:block}
  .slot .car-id{font-size:14px; font-weight:bold; background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px; margin-top:4px; display:inline-block;}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e5e8eb;font-size:14px}
  th{background:#e9eef3}
  button{padding:6px 10px;border:0;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer}
  .muted{color:#667}
</style>
</head>
<body>
<h1>Parking Dashboard <span id="free" class="muted"></span></h1>

<div id="slots" class="slots"></div>

<h2>Cars inside</h2>
<div class="wrap"><table id="cars"></table></div>

<h2>Recent events</h2>
<div class="wrap"><table id="events"></table></div>

<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmt(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + "h " : "") + (h || m ? m + "m " : "") + s + "s";
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  return j;
}

async function refresh() {
  try {
    const [slots, cars, events] = await Promise.all([
      api("/api/slots"),
      api("/api/sessions?status=PARKED"),
      api("/api/events?limit=15")
    ]);

    document.getElementById("free").textContent = "(" + slots.free + " free)";

    // Render Slots (Now includes the car ticket ID if occupied)
    document.getElementById("slots").innerHTML = slots.slots.map(s => {
      let carInfo = s.ticket_no ? `<div class="car-id">${esc(s.ticket_no)}</div>` : "";
      return '<div class="slot ' + (s.status === "EMPTY" ? "empty" : "occ") + '">' +
      "<b>Slot " + s.slot + "</b>" + esc(s.status) + carInfo +
      "<br><small>" + fmt(s.seconds_in_state) + "</small></div>"
    }).join("");

    // Render Cars
    document.getElementById("cars").innerHTML =
      "<tr><th>Ticket ID</th><th>Location</th><th>Entered</th><th>Time Parked</th><th>Fee due</th><th>Paid</th><th>Action</th></tr>" +
      (cars.length ? cars.map(c => {
        let actionStr = "";
        let feeStr = esc(c.fee_due);
        let locStr = c.slot_id ? `<b>Slot ${c.slot_id}</b>` : "<span class='muted'>Driving (No Slot)</span>";
        
        // Handle Grace Period Logic visually
        if (c.fee_due === 0 && !c.paid) {
            feeStr = "₱0 (Grace Period)";
            actionStr = "<span class='muted'>Allowed Exit</span>";
        } else if (c.paid) {
            actionStr = "<span class='muted'>Paid</span>";
        } else {
            actionStr = '<button onclick="pay(' + Number(c.session_id) + ')">Mark paid</button>';
        }

        return "<tr><td>" + esc(c.ticket_no) + "</td><td>" + locStr + "</td><td>" + esc(c.entry_time) +
        "</td><td>" + fmt(c.duration_seconds) + "</td><td>" + feeStr + "</td><td>" +
        (c.paid ? "Yes" : "No") + "</td><td>" + actionStr + "</td></tr>"
      }).join("") : '<tr><td colspan="7" class="muted">No cars inside</td></tr>');

    // Render Log
    document.getElementById("events").innerHTML =
      "<tr><th>Time</th><th>Type</th><th>Detail</th></tr>" +
      events.map(e => "<tr><td>" + esc(e.time) + "</td><td>" + esc(e.type) + "</td><td>" +
        esc(JSON.stringify(e.detail)) + "</td></tr>").join("");
  } catch (err) {
    document.getElementById("free").textContent = "(cannot reach server: " + err.message + ")";
  }
}

async function pay(id) {
  try {
    await api("/api/sessions/" + id + "/pay", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"
    });
  } catch (err) { alert(err.message); }
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
